<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - Hospital Management System</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>

  <div class="menu">
    <b id="menuTitle">Hospital</b>
    <button onclick="goBack()">Back to Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="content">
    <h1>My Profile</h1>

    <div class="form">
      <h3>Profile Information</h3>

      <label>User Type</label>
      <input type="text" id="profileRole" readonly>

      <label>Email (login ID)</label>
      <input type="text" id="profileEmail" readonly>

      <label>Full Name</label>
      <input type="text" id="profileName">

      <label>Phone</label>
      <input type="text" id="profilePhone">

      <div id="patientFields" class="hidden">
        <label>Age</label>
        <input type="number" id="profileAge">

        <label>Gender</label>
        <select id="profileGender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="doctorFields" class="hidden">
        <label>Specialization</label>
        <input type="text" id="profileSpecialization">
      </div>

      <button onclick="saveProfile()">Save Profile</button>
    </div>

    <h1>Change Password</h1>

    <div class="form">
      <h3>Update Password</h3>

      <label>Current Password</label>
      <input type="password" id="oldPassword">

      <label>New Password</label>
      <input type="password" id="newPassword">

      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword">

      <button onclick="changePassword()">Change Password</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="Profile.js"></script>
</body>
</html>
